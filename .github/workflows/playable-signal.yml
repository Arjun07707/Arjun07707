name: Playable Signal

on:
  schedule:
    - cron: "30 19 * * *" # 01:00 IST, after the other daily jobs
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: playable-signal
  cancel-in-progress: true

jobs:
  build:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build playable signal
        run: node scripts/build-playable-signal.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: Arjun07707

      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add assets/playable-signal.svg
          git diff --cached --quiet || git commit -m "chore: update playable signal [skip ci]"
          git pull --rebase
          git push
