name: Galaxy hero

on:
  schedule:
    # Daily, a little after 03:00 UTC.
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/generate-galaxy.mjs"
      - ".github/workflows/galaxy.yml"

permissions:
  contents: write

concurrency:
  group: galaxy-hero
  cancel-in-progress: true

jobs:
  update:
    name: Regenerate assets/hero-galaxy.svg
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate galaxy from repository data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GALAXY_LOGIN: ${{ github.repository_owner }}
        run: node scripts/generate-galaxy.mjs

      - name: Commit the SVG only if it changed
        run: |
          git add assets/hero-galaxy.svg
          if git diff --cached --quiet -- assets/hero-galaxy.svg; then
            echo "Galaxy is unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update galaxy hero [skip ci]"
          git push
