name: Solar System

on:
  schedule:
    - cron: "0 19 * * *" # 00:30 IST, after the city and aquarium jobs
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: solar-system
  cancel-in-progress: true

jobs:
  build:
    name: Regenerate assets/solar-system.svg
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build solar system
        run: node scripts/build-solar-system.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Commit the SVG only if it changed
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add assets/solar-system.svg
          if git diff --cached --quiet -- assets/solar-system.svg; then
            echo "Solar system is unchanged; nothing to commit."
            exit 0
          fi
          git commit -m "chore: update solar system [skip ci]"
          git pull --rebase
          git push
