name: Aquarium

on:
  schedule:
    - cron: "30 18 * * *" # 00:00 IST, 30 min after the 3D city job
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aquarium
  cancel-in-progress: true

jobs:
  build:
    name: Regenerate assets/aquarium.svg
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build aquarium
        run: node scripts/build-aquarium.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Commit the SVG only if it changed
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add assets/aquarium.svg
          if git diff --cached --quiet -- assets/aquarium.svg; then
            echo "Aquarium is unchanged; nothing to commit."
            exit 0
          fi
          git commit -m "chore: update aquarium [skip ci]"
          git pull --rebase
          git push
